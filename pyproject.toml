[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-guard"
version = "0.1.0"
description = "Architecture guardrails for teams building with AI: upfront agent contracts, deterministic topology ratchets, and independent adversarial pre-merge review"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{name = "SenseBeing"}]
dependencies = []
keywords = ["architecture", "code-review", "engineering-policy", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/sensebeing/the-guard"
Repository = "https://github.com/sensebeing/the-guard"
Issues = "https://github.com/sensebeing/the-guard/issues"
Changelog = "https://github.com/sensebeing/the-guard/blob/main/CHANGELOG.md"

[project.scripts]
guard = "the_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
the_guard = ["presets/rules/*.md"]
