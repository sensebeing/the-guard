name: the-guard
inputs:
  preset:
    default: full
  provider:
    default: codex
  github-token:
    default: ${{ github.token }}
  app-id:
    default: ''
  private-key:
    default: ''
  publish-review:
    default: 'true'
  publish-mode:
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: python3 -m pip install "$GITHUB_ACTION_PATH"
    - if: inputs.publish-review == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        THE_GUARD_GITHUB_APP_ID: ${{ inputs.app-id }}
        THE_GUARD_GITHUB_PRIVATE_KEY: ${{ inputs.private-key }}
        THE_GUARD_PUBLISH_MODE: ${{ inputs.publish-mode }}
      run: |
        publish_mode_args=()
        if [ -n "$THE_GUARD_PUBLISH_MODE" ]; then
          publish_mode_args=(--github-publish-mode "$THE_GUARD_PUBLISH_MODE")
        fi
        if guard probe --priority-order "${{ inputs.provider }}" >/dev/null 2>&1; then
          guard review --provider "${{ inputs.provider }}" --github-pr "${{ github.repository }}#${{ github.event.pull_request.number }}" ${publish_mode_args[@]+"${publish_mode_args[@]}"} --json
        else
          guard check --base "origin/${GITHUB_BASE_REF:-main}" --github-pr "${{ github.repository }}#${{ github.event.pull_request.number }}" ${publish_mode_args[@]+"${publish_mode_args[@]}"} --json
        fi
    - if: inputs.publish-review != 'true' || github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        THE_GUARD_GITHUB_APP_ID: ${{ inputs.app-id }}
        THE_GUARD_GITHUB_PRIVATE_KEY: ${{ inputs.private-key }}
      run: guard check --base "origin/${GITHUB_BASE_REF:-main}"
